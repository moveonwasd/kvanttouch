<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>((квантtouch))</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    @font-face {
      font-family: 'Blocky';
      src: url('./fonts/blocky.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: block;
    }

    @font-face {
      font-family: 'TikTok Sans';
      src: url('./fonts/tiktok-sans-cyrillic.woff2') format('woff2');
      font-weight: 300 900;
      font-style: normal;
      font-display: swap;
      unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
    }

    @font-face {
      font-family: 'TikTok Sans';
      src: url('./fonts/tiktok-sans-latin.woff2') format('woff2');
      font-weight: 300 900;
      font-style: normal;
      font-display: swap;
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }

    :root {
      --bg-shell: #1A002E;
      --accent-lime: #E2FA00;
      --accent-purple: #9300FF;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'TikTok Sans', system-ui, -apple-system, sans-serif;
      background: linear-gradient(120deg, #B500E6 0%, #5B0A82 42%, #7D7FA3 100%);
      min-height: 100vh;
      margin: 0;
      padding: 40px 24px;
      color: #FFFFFF;
      display: flex;
      justify-content: center;
      align-items: center;
      -webkit-font-smoothing: antialiased;
    }

    .app-shell {
      width: 100%;
      max-width: 920px;
      background-color: var(--bg-shell);
      border-radius: 28px;
      padding: 40px 46px 56px 46px;
      box-shadow: 0 30px 80px rgba(10, 0, 20, 0.5);
    }

    .logo-text {
      color: var(--accent-lime);
      line-height: 1;
      letter-spacing: -0.01em;
      user-select: none;
      display: inline-flex;
      align-items: center;
    }

    .roster-scroll::-webkit-scrollbar {
      width: 5px;
    }
    .roster-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .roster-scroll::-webkit-scrollbar-thumb {
      background: #8B60AC;
      border-radius: 999px;
    }

    .lesson-logo-svg {
      display: block;
      width: 78px;
      flex-shrink: 0;
      overflow: hidden;
    }

    @media (max-width: 640px) {
      body {
        padding: 12px;
        align-items: flex-start;
      }
      .app-shell {
        padding: 24px 16px 32px 16px;
        border-radius: 20px;
      }
    }
  </style>
</head>
<body>

    <!-- Header -->
    <header class="flex items-center justify-between mb-9 px-4">
      <div class="logo-text gap-[5px]">
        <span class="text-[28px] font-light leading-none">(</span>

        <span class="text-[26px] leading-none"><span class="font-normal">квант</span><span class="font-bold">touch</span></span>
        <span class="text-[19px] font-normal leading-none">)</span>
        <span class="text-[28px] font-light leading-none">)</span>

        <button onclick="openSettingsModal()" title="Настройки" class="p-2 rounded-lg hover:text-white hover:bg-white/5 transition-colors">
          <i data-lucide="settings" class="w-5 h-5"></i>

        <button id="plug-btn" onclick="openUserscriptModal()" title="Юзерскрипт Tampermonkey" class="p-2 rounded-lg hover:text-[#E2FA00] hover:bg-white/5 transition-colors relative">
          <i data-lucide="plug" class="w-5 h-5"></i>
        </button>
      </div>
    </header>

    <!-- Status / Auth Notice Bar (hidden when all connected & authorized) -->
    <div id="status-banner" class="hidden mx-4 mb-5 px-4 py-3 rounded-[14px] bg-white/5 border border-white/10 text-[13.5px] text-white/80 flex flex-wrap items-center justify-between gap-3">
      <div id="status-banner-text" class="flex items-center gap-2"></div>
      <div id="status-banner-actions" class="flex items-center gap-2"></div>
    </div>

    <!-- Section Title -->
    <div class="flex items-center justify-between mb-5 px-4">
      <div class="flex items-center gap-3.5">
        <h1 class="text-[22px] font-normal text-white">Предстоящие занятия</h1>
        <span id="date-badge" class="bg-[#E2FA00] text-[#1A002E] text-[15px] font-medium px-3.5 py-[3px] rounded-[7px] leading-tight">
          сегодня

      </div>

      <input id="date-picker" type="date" onchange="onDateChange(this.value)" class="bg-transparent text-white/40 hover:text-white/80 text-[13px] border border-white/10 rounded-lg px-2.5 py-1 focus:outline-none focus:border-[#E2FA00] cursor-pointer" title="Выбрать дату">
    </div>

    <!-- Lessons List (dynamically rendered) -->
    <div id="lessons-list" class="space-y-4"></div>
  </main>

        <div class="space-y-1.5 min-w-0 flex-1">

            <span id="modal-student-header" class="truncate"></span>
          </div>

        <div id="modal-roster-box" class="border rounded-[18px] p-4 h-[195px] overflow-y-auto roster-scroll space-y-2.5"></div>
      </div>

      <!-- Bitrix24 Absent Pill -->
      <div class="mb-8 flex flex-wrap items-center justify-between gap-3">
        <button id="absent-btn" onclick="toggleAbsentStatus()" class="bg-[#8D64AA] hover:bg-[#7B5298] text-white text-[14px] font-normal px-5 py-2 rounded-full transition-colors">
          <span id="absent-btn-text">Списки отсутствующих поданы</span>
        </button>

        <div id="modal-ext-links" class="flex items-center gap-3 text-[13px] opacity-75"></div>
      </div>

      <!-- Bottom Actions -->
      <div class="flex items-center justify-end gap-3">
        <button id="modal-cancel-btn" type="button" onclick="closeLessonModal()" class="flex items-center gap-2 text-[15px] font-normal border px-5 py-2 rounded-full transition-colors">
          <i data-lucide="x" class="w-4 h-4"></i>
          <span>Отменить</span>
        </button>

        <button type="button" onclick="conductLesson()" class="flex items-center gap-2 text-[15px] font-normal text-white bg-[#9300FF] hover:bg-[#7E00DB] px-6 py-2 rounded-full transition-colors">
          <i data-lucide="check" class="w-4 h-4"></i>

        </button>
      </div>

    </div>

  <!-- ============================================================== -->
  <!-- MODAL: SETTINGS                                                -->
  <!-- ============================================================== -->
  <div id="settings-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black/65 backdrop-blur-sm" onclick="if(event.target === this) closeSettingsModal()">

        </div>

        <label class="flex items-center justify-between pt-2 cursor-pointer">

      <div class="mt-7 flex justify-end">
        <button onclick="saveSettings()" class="bg-[#E2FA00] text-[#1A002E] font-medium text-[14px] px-5 py-2 rounded-[8px] hover:opacity-90 transition-opacity">
          Сохранить
        </button>
      </div>
    </div>
  </div>

  <!-- ============================================================== -->
  <!-- MODAL: USERSCRIPT                                              -->
  <!-- ============================================================== -->
  <div id="userscript-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black/65 backdrop-blur-sm" onclick="if(event.target === this) closeUserscriptModal()">
    <div class="bg-[#1A002E] border border-white/10 text-white w-full max-w-lg rounded-[24px] p-7 shadow-2xl">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-[18px] font-medium">Tampermonkey мост</h3>
        <button onclick="closeUserscriptModal()" class="text-white/50 hover:text-white">

      <p id="userscript-status-text" class="text-[14px] text-white/70 mb-6 leading-relaxed">
        Скрипт связывает этот сайт с AlfaCRM, ERP и Контур.Толком напрямую из твоего браузера.
      </p>

      <div class="flex justify-end">
        <a href="kvanttouch.user.js" class="bg-[#9300FF] hover:bg-[#7E00DB] text-white text-[14px] px-5 py-2.5 rounded-full transition-colors">
          Установить / Обновить kvanttouch.user.js
        </a>

  <script>
    // =========================================================================
    // 1. FONT-ACCURATE BLOCKY SVG LOGO ENGINE
    // =========================================================================
    const measureCanvas = document.createElement('canvas');
    const measureCtx = measureCanvas.getContext('2d');
    let blockyReady = false;

    function measureInkBox(str, fontSize) {
      measureCtx.font = `${fontSize}px Blocky, sans-serif`;
      const m = measureCtx.measureText(str);
      return {
        width: m.actualBoundingBoxLeft + m.actualBoundingBoxRight,
        height: m.actualBoundingBoxAscent + m.actualBoundingBoxDescent,
        left: m.actualBoundingBoxLeft,
        ascent: m.actualBoundingBoxAscent
      };
    }

    function renderBlockyLogo(svgEl) {
      const course = (svgEl.dataset.course || '').toUpperCase();
      const num = svgEl.dataset.num || '';
      const color = svgEl.dataset.color || '#FFFFFF';
      const targetWidth = 78;
      const gap = 3;
      const ns = 'http://www.w3.org/2000/svg';

      svgEl.innerHTML = '';

      const m1 = measureInkBox(course, 100);
      const m2 = measureInkBox(num, 100);
      if (m1.width <= 0 || m2.width <= 0) return;

      let fs1 = 100 * (targetWidth / m1.width);
      let fs2 = 100 * (targetWidth / m2.width);

      let ink1 = measureInkBox(course, fs1);
      let ink2 = measureInkBox(num, fs2);
      if (ink1.width > 0) {
        fs1 = fs1 * (targetWidth / ink1.width);
        ink1 = measureInkBox(course, fs1);
      }
      if (ink2.width > 0) {
        fs2 = fs2 * (targetWidth / ink2.width);
        ink2 = measureInkBox(num, fs2);
      }

      const createText = (str, fs, x, y) => {
        const t = document.createElementNS(ns, 'text');
        t.setAttribute('font-family', 'Blocky');
        t.setAttribute('font-size', fs.toFixed(2));
        t.setAttribute('fill', color);
        t.setAttribute('x', x.toFixed(2));
        t.setAttribute('y', y.toFixed(2));
        t.textContent = str;
        svgEl.appendChild(t);
      };

      createText(course, fs1, ink1.left, ink1.ascent);
      createText(num, fs2, ink2.left, ink1.height + gap + ink2.ascent);

      const totalHeight = ink1.height + gap + ink2.height;
      svgEl.setAttribute('viewBox', `0 0 ${targetWidth} ${totalHeight.toFixed(2)}`);
      svgEl.setAttribute('preserveAspectRatio', 'xMinYMin meet');
      svgEl.setAttribute('width', targetWidth);
      svgEl.setAttribute('height', totalHeight.toFixed(2));
      svgEl.style.width = targetWidth + 'px';
      svgEl.style.height = totalHeight.toFixed(2) + 'px';
    }

    function renderAllLogos() {
      if (!blockyReady) return;
      document.querySelectorAll('.lesson-logo-svg').forEach(renderBlockyLogo);
    }

    (async function initFonts() {
      try {
        await document.fonts.load('100px Blocky');
      } catch (e) {}
      await document.fonts.ready;
      blockyReady = true;
      renderAllLogos();
    })();

    // =========================================================================
    // 2. DATA MODEL, NORMALIZATION & MERGING (CRM + ERP)
    // =========================================================================
    function getTodayISO() {
      const d = new Date();
      const pad = (n) => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    }

    let selectedDate = getTodayISO();
    document.getElementById('date-picker').value = selectedDate;

    function timeToMinutes(hhmm) {
      if (!hhmm || !hhmm.includes(':')) return 0;
      const [h, m] = hhmm.split(':').map(Number);
      return h * 60 + m;
    }

    function normalizeName(str) {
      return (str || '')
        .toLowerCase()
        .replace(/^(gr\.?|гр\.?|группа)\s+/i, '')
        .replace(/[^\p{L}\p{N}]+/gu, ' ')
        .trim();
    }

    function extractCourseBadge(courseTitle, subject) {
      const src = `${courseTitle || ''} ${subject || ''}`;
      const rules = [
        [/нейро/i, 'НЕЙРО'],
        [/дизайн|график/i, 'ДИЗАЙН'],
        [/roblox|роблокс/i, 'ROBLOX'],
        [/python|питон/i, 'PYTHON'],
        [/scratch|скретч/i, 'SCRATCH'],
        [/unity|юнити/i, 'UNITY'],
        [/middle|мидл/i, 'MIDDLE'],
        [/junior|джуниор/i, 'JUNIOR'],
        [/senior|сеньор/i, 'SENIOR'],
        [/stencyl/i, 'STENCYL'],
        [/blender|блендер|3d/i, '3D'],
        [/minecraft|майнкрафт/i, 'MC'],
        [/web|веб|html|css|js/i, 'WEB']
      ];
      for (const [re, label] of rules) {
        if (re.test(src)) return label;
      }
      const fallback = (courseTitle || subject || 'УРОК').trim().split(/\s+/)[0].toUpperCase();
      return fallback.slice(0, 8);
    }

    function parseErpDateStr(item) {
      if (item.date_start && item.date_start.length >= 16) {
        return {
          date: item.date_start.slice(0, 10),
          time: item.date_start.slice(11, 16)
        };
      }
      if (item.Day && item.Time) {
        const [dd, mm, yyyy] = item.Day.split('.');
        return { date: `${yyyy}-${mm}-${dd}`, time: item.Time.slice(0, 5) };
      }
      return { date: '', time: '' };
    }

    function mergeCrmAndErp(crmCollection, erpStudyList, erpArchiveList, dateStr) {
      // 1. Parse CRM items for target date
      const crmItems = (crmCollection || [])
        .filter((c) => c.date === dateStr)
        .map((c) => {
          const startTime = (c.start || '').slice(11, 16);
          const endTime = (c.end || '').slice(11, 16);
          const customersObj = c.customers || {};
          const students = Object.entries(customersObj).map(([id, name]) => ({
            id,
            name,
            present: true,
            coins: 0
          }));
          return {
            crmId: String(c.id),
            type: String(c.type) === '2' ? 'group' : 'individual',
            crmStatus: String(c.status), // '1' planned, '2' canceled, '3' conducted
            title: c.title || '',
            subject: c.subject || '',
            startTime,
            endTime,
            startMinutes: timeToMinutes(startTime),
            endMinutes: timeToMinutes(endTime),
            students,
            topic: c.topic || '',
            note: c.note || '',
            homework: c.homework || ''
          };
        });

      // 2. Combine & deduplicate ERP items for target date
      const erpMap = new Map();
      [...(erpStudyList || []), ...(erpArchiveList || [])].forEach((e) => {
        const parsed = parseErpDateStr(e);
        if (parsed.date !== dateStr) return;
        const key = String(e.scheduleId || e.id);
        // Prefer archive/completed over active if both appear, or latest
        if (!erpMap.has(key) || e.lifecycleState === 'completed') {
          erpMap.set(key, {
            erpId: String(e.id),
            scheduleId: String(e.scheduleId || e.id),
            url: e.url ? `https://erp.kvantastica.ru${e.url}` : '',
            lifecycleState: e.lifecycleState || 'scheduled',
            lifecycleLabel: e.lifecycleLabel || '',
            groupTitle: e.groupTitle || '',
            courseTitle: e.courseTitle || '',
            lessonTitle: e.lessonTitle || '',
            current: e.current,
            max: e.max,
            startTime: parsed.time,
            startMinutes: timeToMinutes(parsed.time),
            studentsCount: e.students || 0,
            meet: e.meet || ''
          });
        }
      });
      const erpItems = Array.from(erpMap.values());
      const usedErpIds = new Set();

      const merged = [];

      // 3. Match CRM -> ERP
      for (const crm of crmItems) {
        const normCrm = normalizeName(crm.title);
        let bestErp = null;
        let bestDiff = Infinity;

        for (const erp of erpItems) {
          if (usedErpIds.has(erp.scheduleId)) continue;
          const normErp = normalizeName(erp.groupTitle);
          const namesMatch =
            normCrm && normErp &&
            (normCrm === normErp || normCrm.includes(normErp) || normErp.includes(normCrm));

          if (namesMatch) {
            const diff = Math.abs(crm.startMinutes - erp.startMinutes);
            if (diff < bestDiff) {
              bestDiff = diff;
              bestErp = erp;
            }
          }
        }

        if (bestErp) {
          usedErpIds.add(bestErp.scheduleId);
          const timeMismatch = Math.abs(crm.startMinutes - bestErp.startMinutes) > 5;
          merged.push({
            id: `crm-${crm.crmId}`,
            crm,
            erp: bestErp,
            type: crm.type,
            headerName: crm.title || bestErp.groupTitle,
            courseBadge: extractCourseBadge(bestErp.courseTitle, crm.subject),
            lessonNum: bestErp.current != null ? String(bestErp.current).padStart(2, '0') : '—',
            lessonTitle: bestErp.lessonTitle || crm.topic || crm.subject,
            startTime: crm.startTime,
            endTime: crm.endTime,
            startMinutes: crm.startMinutes,
            endMinutes: crm.endMinutes,
            students: crm.students,
            flags: {
              missingInErp: false,
              missingInCrm: false,
              timeMismatch,
              erpTime: timeMismatch ? bestErp.startTime : null,
              canceled: crm.crmStatus === '2',
              conducted: crm.crmStatus === '3'
            }
          });
        } else {
          merged.push({
            id: `crm-${crm.crmId}`,
            crm,
            erp: null,
            type: crm.type,
            headerName: crm.title,
            courseBadge: extractCourseBadge('', crm.subject),
            lessonNum: '—',
            lessonTitle: crm.topic || crm.subject,
            startTime: crm.startTime,
            endTime: crm.endTime,
            startMinutes: crm.startMinutes,
            endMinutes: crm.endMinutes,
            students: crm.students,
            flags: {
              missingInErp: true,
              missingInCrm: false,
              timeMismatch: false,
              canceled: crm.crmStatus === '2',
              conducted: crm.crmStatus === '3'
            }
          });
        }
      }

      // 4. Add remaining unmatched ERP lessons (ghost/missing in CRM)
      for (const erp of erpItems) {
        if (usedErpIds.has(erp.scheduleId)) continue;
        const endMinutes = erp.startMinutes + 60;
        const pad = (n) => String(n).padStart(2, '0');
        const endTime = `${pad(Math.floor(endMinutes / 60))}:${pad(endMinutes % 60)}`;
        merged.push({
          id: `erp-${erp.scheduleId}`,
          crm: null,
          erp,
          type: erp.studentsCount > 1 ? 'group' : 'individual',
          headerName: erp.groupTitle,
          courseBadge: extractCourseBadge(erp.courseTitle, ''),
          lessonNum: erp.current != null ? String(erp.current).padStart(2, '0') : '—',
          lessonTitle: erp.lessonTitle || erp.courseTitle,
          startTime: erp.startTime,
          endTime,
          startMinutes: erp.startMinutes,
          endMinutes,
          students: [],
          flags: {
            missingInErp: false,
            missingInCrm: true,
            timeMismatch: false,
            canceled: false,
            conducted: erp.lifecycleState === 'completed'
          }
        });
      }

      // 5. Sort chronologically
      merged.sort((a, b) => a.startMinutes - b.startMinutes);

      // 6. Assign visual state ('past' | 'active' | 'upcoming')
      const now = new Date();
      const isToday = dateStr === getTodayISO();
      const nowMinutes = now.getHours() * 60 + now.getMinutes();

      let activeAssigned = false;
      if (isToday) {
        // Priority 1: Currently in progress or ERP attention (<= 15m before)
        for (const item of merged) {
          if (item.flags.conducted || item.flags.canceled) continue;
          const inProgress = nowMinutes >= item.startMinutes && nowMinutes <= item.endMinutes;
          const readyInErp = item.erp && item.erp.lifecycleState === 'attention';
          if (inProgress || readyInErp) {
            item.visualState = 'active';
            activeAssigned = true;
            break;
          }
        }
        // Priority 2: Next upcoming non-done lesson today
        if (!activeAssigned) {
          for (const item of merged) {
            if (item.flags.conducted || item.flags.canceled) continue;
            if (item.endMinutes >= nowMinutes) {
              item.visualState = 'active';
              activeAssigned = true;
              break;
            }
          }
        }
      }

      for (const item of merged) {
        if (item.visualState === 'active') continue;
        if (item.flags.conducted || item.flags.canceled || (isToday && item.endMinutes < nowMinutes && item.erp?.lifecycleState === 'completed')) {
          item.visualState = 'past';
        } else {
          item.visualState = 'upcoming';
        }
      }

      return merged;
    }

    function getActiveTimerInfo(lesson) {
      if (selectedDate !== getTodayISO()) {
        return { text: `${lesson.startTime} — ${lesson.endTime}`, progress: 0 };
      }
      const now = new Date();
      const nowMin = now.getHours() * 60 + now.getMinutes();

      if (nowMin >= lesson.startMinutes && nowMin <= lesson.endMinutes) {
        const rem = Math.max(0, lesson.endMinutes - nowMin);
        const dur = Math.max(1, lesson.endMinutes - lesson.startMinutes);
        const pct = Math.min(100, Math.max(4, Math.round(((nowMin - lesson.startMinutes) / dur) * 100)));
        return { text: `Осталось ${rem} мин.`, progress: pct };
      }
      if (nowMin < lesson.startMinutes) {
        const wait = lesson.startMinutes - nowMin;
        const text = wait >= 60
          ? `Через ${Math.floor(wait / 60)} ч ${wait % 60} мин.`
          : `Через ${wait} мин.`;
        return { text, progress: 8 };
      }
      const over = nowMin - lesson.endMinutes;
      return { text: `Идёт (+${over} мин.)`, progress: 100 };
    }

    function renderFlagsHtml(flags, isLightCard) {
      const tags = [];

      if (flags.missingInErp && !flags.canceled) {
        tags.push(`<span class="px-2 py-0.5 rounded-md text-[11.5px] font-medium bg-rose-500/20 text-rose-200 border border-rose-400/30">Нет в ERP</span>`);
      }
      if (flags.missingInCrm) {
        tags.push(`<span class="px-2 py-0.5 rounded-md text-[11.5px] font-medium ${badgeClass}">Только в ERP</span>`);
      }
      return tags.join('');
    }

    // =========================================================================

    let bridgeConnected = false;

    function showBanner(textHtml, actionsHtml) {
      const banner = document.getElementById('status-banner');
      document.getElementById('status-banner-text').innerHTML = textHtml;
      document.getElementById('status-banner-actions').innerHTML = actionsHtml || '';

    function onDateChange(val) {
      if (!val) return;
      selectedDate = val;
      const badge = document.getElementById('date-badge');
      badge.innerText = val === getTodayISO() ? 'сегодня' : val.split('-').reverse().slice(0, 2).join('.');
      if (bridgeConnected) {
        requestTodayData();
      }
    }

    function stopSpinner() {
      document.getElementById('refresh-btn').classList.remove('animate-spin');
      if (loadTimeoutTimer) {
        clearTimeout(loadTimeoutTimer);
        loadTimeoutTimer = null;
      }
    }

    function requestTodayData() {
      if (!bridgeConnected) return;
      pendingRequestId++;
      const reqId = pendingRequestId;
      document.getElementById('refresh-btn').classList.add('animate-spin');

      if (loadTimeoutTimer) clearTimeout(loadTimeoutTimer);
      loadTimeoutTimer = setTimeout(() => {
        if (pendingRequestId === reqId) {
          stopSpinner();
          showBanner(
            `<span>Нет ответа от скрипта (проверь, разрешены ли запросы в Tampermonkey и обнови скрипт до 1.1.1).</span>`,
            `<a href="kvanttouch.user.js" class="bg-[#9300FF] text-white px-3 py-1 rounded-full">Обновить скрипт</a><button onclick="requestTodayData()" class="bg-[#E2FA00] text-[#1A002E] font-medium px-3 py-1 rounded-lg">Повторить</button>`
          );
        }
      }, 15000);

      window.postMessage({
        source: 'KVANT_UI',
        type: 'FETCH_TODAY',
        date: selectedDate,
        requestId: reqId
      }, '*');
    }

    window.addEventListener('message', (event) => {
      if (event.origin !== window.location.origin && event.origin !== 'null') return;
      if (!event.data || event.data.source !== 'KVANT_BRIDGE') return;
      const msg = event.data;

      if (msg.type === 'BRIDGE_READY') {
        if (!bridgeConnected) {
          bridgeConnected = true;
          document.getElementById('plug-btn').classList.add('text-[#E2FA00]');
          document.getElementById('userscript-status-text').innerText =
            `Tampermonkey-мост подключён (версия ${msg.version}). Данные загружаются напрямую из AlfaCRM и ERP.`;
          requestTodayData();
        }
      } else if (msg.type === 'TODAY_DATA') {
        stopSpinner();
        const p = msg.payload || {};

        const authLinks = [];
        if (p.crm && p.crm.authRequired) {
          authLinks.push(`<a href="https://codeclassonline.s20.online/teacher/1/calendar/index" target="_blank" class="bg-white/10 hover:bg-white/20 px-3 py-1 rounded-lg text-white">Войти в CRM ↗</a>`);
        }
        if ((p.erpStudy && p.erpStudy.authRequired) || (p.erpArchive && p.erpArchive.authRequired)) {
          authLinks.push(`<a href="https://erp.kvantastica.ru/admin/teacher-study" target="_blank" class="bg-white/10 hover:bg-white/20 px-3 py-1 rounded-lg text-white">Войти в ERP ↗</a>`);
        }

        const errors = [];
        if (p.crm && !p.crm.ok && !p.crm.authRequired) errors.push(`CRM: ${p.crm.error || p.crm.status}`);
        if (p.erpStudy && !p.erpStudy.ok && !p.erpStudy.authRequired) errors.push(`ERP: ${p.erpStudy.error || p.erpStudy.status}`);

        if (authLinks.length > 0) {
          showBanner(
            `<span>Требуется вход в систему для загрузки реальных уроков:</span>`,
            authLinks.join('') + `<button onclick="requestTodayData()" class="bg-[#E2FA00] text-[#1A002E] font-medium px-3 py-1 rounded-lg">Обновить</button>`
          );
        } else if (errors.length > 0) {
          showBanner(
            `<span>Ошибка загрузки (${escapeHtml(errors.join('; '))})</span>`,
            `<button onclick="requestTodayData()" class="bg-[#E2FA00] text-[#1A002E] font-medium px-3 py-1 rounded-lg">Повторить</button>`
          );
        } else {
          hideBanner();
        }

        try {
          const crmList = p.crm?.ok ? (p.crm.data?.collection || []) : [];
          const erpStudyList = p.erpStudy?.ok ? (p.erpStudy.data?.data || []) : [];
          const erpArchiveList = p.erpArchive?.ok ? (p.erpArchive.data?.data || []) : [];

          if (p.crm?.ok || p.erpStudy?.ok || p.erpArchive?.ok) {
            const merged = mergeCrmAndErp(crmList, erpStudyList, erpArchiveList, p.date || selectedDate);
            renderLessons(merged);
          }
        } catch (err) {
          console.error('[квантtouch] Ошибка обработки данных:', err);
          showBanner(`<span>Ошибка обработки расписания: ${escapeHtml(String(err))}</span>`, '');
        }
      }
    });

    // Initial render with demo data while checking for Tampermonkey bridge
    renderLessons(demoLessons);

    // Ping Tampermonkey script briefly on load
    let pingCount = 0;
    const pingTimer = setInterval(() => {
      if (bridgeConnected || pingCount >= 6) {
        clearInterval(pingTimer);
        if (!bridgeConnected) {
          showBanner(
            `<span>Tampermonkey-скрипт не обнаружен (показан демо-режим).</span>`,
            `<a href="kvanttouch.user.js" class="bg-[#9300FF] hover:bg-[#7E00DB] text-white px-3.5 py-1 rounded-full">Установить скрипт</a>`
          );
        }
        return;
      }
      pingCount++;
      window.postMessage({ source: 'KVANT_UI', type: 'PING' }, '*');
    }, 250);
  </script>
</body>
</html>
