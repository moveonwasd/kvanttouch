<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>((квантtouch))</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    @font-face {
      font-family: 'Blocky';
      src: url('./fonts/blocky.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: block;
    }

    @font-face {
      font-family: 'TikTok Sans';
      src: url('./fonts/tiktok-sans-cyrillic.woff2') format('woff2');
      font-weight: 300 900;
      font-style: normal;
      font-display: swap;
      unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
    }

    @font-face {
      font-family: 'TikTok Sans';
      src: url('./fonts/tiktok-sans-latin.woff2') format('woff2');
      font-weight: 300 900;
      font-style: normal;
      font-display: swap;
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }

    :root {
      --bg-shell: #1A002E;
      --accent-lime: #E2FA00;
      --accent-purple: #9300FF;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'TikTok Sans', system-ui, -apple-system, sans-serif;
      background: linear-gradient(120deg, #B500E6 0%, #5B0A82 42%, #7D7FA3 100%);
      min-height: 100vh;
      margin: 0;
      padding: 40px 24px;
      color: #FFFFFF;
      display: flex;
      justify-content: center;
      align-items: center;
      -webkit-font-smoothing: antialiased;
    }

    .app-shell {
      width: 100%;
      max-width: 920px;
      background-color: var(--bg-shell);
      border-radius: 28px;
      padding: 40px 46px 56px 46px;
      box-shadow: 0 30px 80px rgba(10, 0, 20, 0.5);
    }

    .logo-text {
      color: var(--accent-lime);
      line-height: 1;
      letter-spacing: -0.01em;
      user-select: none;
      display: inline-flex;
      align-items: center;
    }

    .roster-scroll::-webkit-scrollbar {
      width: 5px;
    }
    .roster-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .roster-scroll::-webkit-scrollbar-thumb {
      background: #8B60AC;
      border-radius: 999px;
    }

    .lesson-logo-svg {
      display: block;
      width: 78px;
      flex-shrink: 0;
      overflow: hidden;
    }

    @media (max-width: 640px) {
      body {
        padding: 12px;
        align-items: flex-start;
      }
      .app-shell {
        padding: 24px 16px 32px 16px;
        border-radius: 20px;
      }
    }
  </style>
</head>
<body>

    <!-- Header -->
    <header class="flex items-center justify-between mb-9 px-4">
      <div class="logo-text gap-[5px]">

        <span class="text-[19px] font-normal leading-none">(</span>
        <span class="text-[26px] leading-none"><span class="font-normal">квант</span><span class="font-bold">touch</span></span>

        </button>
      </div>
    </header>

    <!-- Status / Auth Notice Stack -->
    <div id="status-stack" class="hidden mx-4 mb-6 space-y-2.5"></div>

    <!-- Section Title -->
    <div class="flex items-center justify-between mb-5 px-4">

        <h1 class="text-[22px] font-normal text-white">Предстоящие занятия</h1>
        <button onclick="openDatePicker()" class="bg-[#E2FA00] text-[#1A002E] text-[15px] font-medium px-3.5 py-[3px] rounded-[7px] leading-tight hover:opacity-90 transition-opacity cursor-pointer" title="Выбрать дату">

      <div class="relative">

          <i data-lucide="x" class="w-4 h-4"></i>

          <input type="text" id="setting-ktalk-url" placeholder="https://kvantastica.ktalk.ru/room" class="w-full bg-[#120020] border border-white/15 rounded-xl px-3.5 py-2.5 text-white placeholder-white/25 focus:outline-none focus:border-[#E2FA00]">
        </div>

        <label class="flex items-center justify-between pt-1 cursor-pointer">

      <div class="mt-6 flex justify-end">

  <!-- ============================================================== -->
  <!-- MODAL: USERSCRIPT                                              -->
  <!-- ============================================================== -->
  <div id="userscript-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black/65 backdrop-blur-sm" onclick="if(event.target === this) closeUserscriptModal()">
    <div class="bg-[#1A002E] border border-white/10 text-white w-full max-w-lg rounded-[24px] p-7 shadow-2xl">
      <div class="flex items-center justify-between mb-4">

      <div class="flex justify-end">
        <a href="kvanttouch.user.js" class="bg-[#9300FF] hover:bg-[#7E00DB] text-white text-[14px] px-5 py-2.5 rounded-full transition-colors">

  <script>
    // =========================================================================
    // 1. SETTINGS & COURSE ABBREVIATION RULES
    // =========================================================================
    const DEFAULT_COURSE_RULES_TEXT = [
      'High Online => HIGH',
      'Middle Online => MIDDLE',
      'Junior Online => JUNIOR',
      'Senior Online => SENIOR',
      'Графический дизайн => ДИЗАЙН',
      'Нейросети => НЕЙРО',
      'Python => PYTHON',
      'Roblox => ROBLOX',
      'Scratch => SCRATCH',
      'Unity => UNITY'
    ].join('\n');

    function loadCourseRulesText() {
      return localStorage.getItem('kvant_course_rules') || DEFAULT_COURSE_RULES_TEXT;
    }

    function parseCourseRules() {
      const text = loadCourseRulesText();
      return text
        .split('\n')
        .map((line) => line.trim())
        .filter((line) => line.includes('=>'))
        .map((line) => {
          const [pattern, code] = line.split('=>').map((s) => s.trim());
          return { pattern, code: code.toUpperCase() };
        })
        .filter((r) => r.pattern && r.code);
    }

    function loadSettingsToForm() {
      document.getElementById('setting-course-rules').value = loadCourseRulesText();
      document.getElementById('setting-b24-webhook').value = localStorage.getItem('kvant_b24_webhook') || '';
      document.getElementById('setting-ktalk-url').value = localStorage.getItem('kvant_ktalk_url') || '';
      const auto = localStorage.getItem('kvant_auto_absent');
      document.getElementById('setting-auto-absent').checked = auto === null ? true : auto === 'true';
    }
    loadSettingsToForm();

    // =========================================================================
    // 2. FONT-ACCURATE BLOCKY SVG LOGO ENGINE
    // =========================================================================
    const measureCanvas = document.createElement('canvas');
    const measureCtx = measureCanvas.getContext('2d');
    let blockyReady = false;

    function measureInkBox(str, fontSize) {
      measureCtx.font = `${fontSize}px Blocky, sans-serif`;
      const m = measureCtx.measureText(str);
      return {
        width: m.actualBoundingBoxLeft + m.actualBoundingBoxRight,
        height: m.actualBoundingBoxAscent + m.actualBoundingBoxDescent,
        left: m.actualBoundingBoxLeft,
        ascent: m.actualBoundingBoxAscent
      };
    }

    function renderBlockyLogo(svgEl) {
      const course = (svgEl.dataset.course || '').toUpperCase();
      const num = svgEl.dataset.num || '';
      const color = svgEl.dataset.color || '#FFFFFF';
      const targetWidth = 78;
      const gap = 3;
      const ns = 'http://www.w3.org/2000/svg';

      svgEl.innerHTML = '';
      if (!course || !num) return;

      const m1 = measureInkBox(course, 100);
      const m2 = measureInkBox(num, 100);
      if (m1.width <= 0 || m2.width <= 0) return;

      let fs1 = 100 * (targetWidth / m1.width);
      let fs2 = 100 * (targetWidth / m2.width);

      let ink1 = measureInkBox(course, fs1);
      let ink2 = measureInkBox(num, fs2);
      if (ink1.width > 0) {
        fs1 = fs1 * (targetWidth / ink1.width);
        ink1 = measureInkBox(course, fs1);
      }
      if (ink2.width > 0) {
        fs2 = fs2 * (targetWidth / ink2.width);
        ink2 = measureInkBox(num, fs2);
      }

      const createText = (str, fs, x, y) => {
        const t = document.createElementNS(ns, 'text');
        t.setAttribute('font-family', 'Blocky');
        t.setAttribute('font-size', fs.toFixed(2));
        t.setAttribute('fill', color);
        t.setAttribute('x', x.toFixed(2));
        t.setAttribute('y', y.toFixed(2));
        t.textContent = str;
        svgEl.appendChild(t);
      };

      createText(course, fs1, ink1.left, ink1.ascent);
      createText(num, fs2, ink2.left, ink1.height + gap + ink2.ascent);

      const totalHeight = ink1.height + gap + ink2.height;
      svgEl.setAttribute('viewBox', `0 0 ${targetWidth} ${totalHeight.toFixed(2)}`);
      svgEl.setAttribute('preserveAspectRatio', 'xMinYMin meet');
      svgEl.setAttribute('width', targetWidth);
      svgEl.setAttribute('height', totalHeight.toFixed(2));
      svgEl.style.width = targetWidth + 'px';
      svgEl.style.height = totalHeight.toFixed(2) + 'px';
    }

    function renderAllLogos() {
      if (!blockyReady) return;
      document.querySelectorAll('.lesson-logo-svg').forEach(renderBlockyLogo);
    }

    (async function initFonts() {
      try {
        await document.fonts.load('100px Blocky');
      } catch (e) {}
      await document.fonts.ready;
      blockyReady = true;
      renderAllLogos();
    })();

    // =========================================================================
    // 3. DATA MODEL, CLEANING, MATCHING & MERGING (CRM + ERP)
    // =========================================================================
    function getTodayISO() {
      const d = new Date();
      const pad = (n) => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    }

    let selectedDate = getTodayISO();
    document.getElementById('date-picker').value = selectedDate;

    function timeToMinutes(hhmm) {
      if (!hhmm || !hhmm.includes(':')) return 0;
      const [h, m] = hhmm.split(':').map(Number);
      return h * 60 + m;
    }

    /**
     * Extracts clean group/student identity for matching CRM <-> ERP:
     * - Strips ERP suffixes after // or \\ or / (e.g. "Кулакова София // индив // ...")
     * - Strips trailing group size like "(6)" (e.g. "Gr.High Online #397 (6)")
     * - Strips "gr.", "sub.", "гр.", "группа"
     */
    function extractMatchTokens(str) {
      let clean = (str || '')
        .split(/\/\/|\\\\|\//)[0]
        .replace(/\(\d+\)\s*$/g, '')
        .replace(/^(gr\.?|sub\.?|гр\.?|группа)\s*/i, '')
        .toLowerCase()
        .replace(/[^\p{L}\p{N}#]+/gu, ' ')
        .trim();

      return {
        clean,
        tokens: clean ? clean.split(/\s+/) : []
      };
    }

    function isSameEntity(crmName, erpGroupName) {
      const a = extractMatchTokens(crmName);
      const b = extractMatchTokens(erpGroupName);
      if (!a.clean || !b.clean) return false;
      if (a.clean === b.clean) return true;
      if (a.clean.includes(b.clean) || b.clean.includes(a.clean)) return true;

      // Individual students: CRM "Уварова Анна Владимировна" vs ERP "Уварова Анна"
      if (b.tokens.length >= 2 && a.tokens.length >= 2) {
        const bInA = b.tokens.every((t) => a.tokens.includes(t));
        const aInB = a.tokens.every((t) => b.tokens.includes(t));
        if (bInA || aInB) return true;
      }
      return false;
    }

    function extractCourseBadge(erp) {
      if (!erp) return 'НЕТ ERP';
      const rules = parseCourseRules();
      const src = `${erp.courseTitle || ''} ${erp.lessonTitle || ''}`.toLowerCase();

      for (const r of rules) {
        if (src.includes(r.pattern.toLowerCase())) {
          return r.code;
        }
      }

      const firstWord = (erp.courseTitle || erp.lessonTitle || 'УРОК')
        .replace(/^(отработка|курс)\s+/i, '')
        .trim()
        .split(/\s+/)[0]
        .toUpperCase();
      return firstWord.slice(0, 8) || 'УРОК';
    }

    /**
     * Cleans ERP lesson title per user spec:
     * - Removes "(83 из 120)"
     * - Removes course name prefixes ("High Online.", "Middle Online.", etc.)
     * - Removes "Урок №22." / "Урок 22." while keeping "Модуль 3." and the topic
     */
    function cleanErpLessonTitle(erp) {
      if (!erp) return null;
      let t = (erp.lessonTitle || '').trim();
      if (!t) return erp.courseTitle || 'Без названия';

      // Strip leading "(83 из 120)"
      t = t.replace(/^\(\s*\d+\s+из\s+\d+\s*\)\s*/i, '');

      // Strip "Отработка " prefix if present before course name
      t = t.replace(/^Отработка\s+/i, '');

      // Strip course name prefixes (configured rules + courseTitle base)
      const rules = parseCourseRules();
      const prefixes = rules.map((r) => r.pattern);
      if (erp.courseTitle) {
        const baseCourse = erp.courseTitle
          .replace(/\s*(Квантастика|Онлайн\s*КК|Онлайн)\s*$/i, '')
          .trim();
        if (baseCourse) prefixes.unshift(baseCourse);
        prefixes.unshift(erp.courseTitle);
      }

      for (const p of prefixes) {
        if (!p) continue;
        const escaped = p.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const re = new RegExp(`^${escaped}[\\s.:,-]*`, 'i');
        t = t.replace(re, '');
      }

      // Strip "Урок №22." / "Урок 22." anywhere (preserving "Модуль 3." before it)
      t = t.replace(/Урок\s*№?\s*\d+\s*[.:,-]*\s*/gi, '');

      t = t.replace(/^\s*[.:,-]+\s*/, '').trim();
      return t || erp.lessonTitle;
    }

    function parseErpDateStr(item) {
      if (item.date_start && item.date_start.length >= 16) {
        return {
          date: item.date_start.slice(0, 10),
          time: item.date_start.slice(11, 16)
        };
      }
      if (item.Day && item.Time) {
        const [dd, mm, yyyy] = item.Day.split('.');
        return { date: `${yyyy}-${mm}-${dd}`, time: item.Time.slice(0, 5) };
      }
      return { date: '', time: '' };
    }

    function mergeCrmAndErp(crmCollection, erpStudyList, erpArchiveList, dateStr) {
      const todayISO = getTodayISO();
      const isViewingToday = dateStr === todayISO;

      // 1. Parse CRM items for target date
      const crmItems = (crmCollection || [])
        .filter((c) => c.date === dateStr)
        .map((c) => {
          const startTime = (c.start || '').slice(11, 16);
          const endTime = (c.end || '').slice(11, 16);
          const customersObj = c.customers || {};
          const students = Object.entries(customersObj).map(([id, name]) => ({
            id,
            name,
            present: true,
            coins: 0
          }));
          return {
            crmId: String(c.id),
            type: String(c.type) === '2' ? 'group' : 'individual',
            crmStatus: String(c.status),
            title: c.title || '',
            subject: c.subject || '',
            startTime,
            endTime,
            startMinutes: timeToMinutes(startTime),
            endMinutes: timeToMinutes(endTime),
            students,
            topic: c.topic || '',
            note: c.note || ''
          };
        });

      // 2. Collect ERP items:
      //    - All items from study + archive for dateStr
      //    - PLUS when viewing today, any unclosed/active items in /study from earlier dates (stale junk in ERP)
      const erpMap = new Map();
      const registerErp = (e, fromArchive) => {
        const parsed = parseErpDateStr(e);
        if (!parsed.date) return;

        const isTargetDate = parsed.date === dateStr;
        const isStaleActive = isViewingToday && !fromArchive && parsed.date < dateStr;
        if (!isTargetDate && !isStaleActive) return;

        const key = String(e.scheduleId || e.id);
        if (!erpMap.has(key) || fromArchive) {
          erpMap.set(key, {
            erpId: String(e.id),
            scheduleId: String(e.scheduleId || e.id),
            url: e.url ? `https://erp.kvantastica.ru${e.url}` : `https://erp.kvantastica.ru/admin/teacher-study/${e.scheduleId || e.id}`,
            lifecycleState: e.lifecycleState || (fromArchive ? 'completed' : 'scheduled'),
            lifecycleLabel: e.lifecycleLabel || '',
            groupTitle: e.groupTitle || '',
            courseTitle: e.courseTitle || '',
            lessonTitle: e.lessonTitle || '',
            current: e.current,
            max: e.max,
            date: parsed.date,
            isStaleDate: isStaleActive,
            startTime: parsed.time,
            startMinutes: timeToMinutes(parsed.time),
            studentsCount: e.students || 0,
            meet: e.meet || ''
          });
        }
      };

      (erpStudyList || []).forEach((e) => registerErp(e, false));
      (erpArchiveList || []).forEach((e) => registerErp(e, true));

      const erpItems = Array.from(erpMap.values());
      const usedErpIds = new Set();
      const merged = [];

      // 3. Match CRM -> ERP (preferring same date first, then closest time)
      for (const crm of crmItems) {
        let bestErp = null;
        let bestDiff = Infinity;

        for (const erp of erpItems) {
          if (usedErpIds.has(erp.scheduleId)) continue;
          if (erp.date !== dateStr) continue;

          if (isSameEntity(crm.title, erp.groupTitle)) {
            const diff = Math.abs(crm.startMinutes - erp.startMinutes);
            if (diff < bestDiff) {
              bestDiff = diff;
              bestErp = erp;
            }
          }
        }

        if (bestErp) {
          usedErpIds.add(bestErp.scheduleId);
          const timeMismatch = Math.abs(crm.startMinutes - bestErp.startMinutes) > 5;
          merged.push({
            id: `crm-${crm.crmId}`,
            crm,
            erp: bestErp,
            type: crm.type,
            headerName: crm.title || bestErp.groupTitle,
            courseBadge: extractCourseBadge(bestErp),
            lessonNum: bestErp.current != null ? String(bestErp.current).padStart(2, '0') : '—',
            lessonTitle: cleanErpLessonTitle(bestErp),
            startTime: crm.startTime,
            endTime: crm.endTime,
            startMinutes: crm.startMinutes,
            endMinutes: crm.endMinutes,
            students: crm.students,
            flags: {
              missingInErp: false,
              missingInCrm: false,
              timeMismatch,
              erpTime: timeMismatch ? bestErp.startTime : null,
              canceled: crm.crmStatus === '2',
              conducted: crm.crmStatus === '3'
            }
          });
        } else {
          merged.push({
            id: `crm-${crm.crmId}`,
            crm,
            erp: null,
            type: crm.type,
            headerName: crm.title,
            courseBadge: 'НЕТ',
            lessonNum: 'ERP',
            lessonTitle: crm.crmStatus === '2' ? (crm.note || 'Урок отменён') : (crm.topic || 'Нет урока в ERP'),
            startTime: crm.startTime,
            endTime: crm.endTime,
            startMinutes: crm.startMinutes,
            endMinutes: crm.endMinutes,
            students: crm.students,
            flags: {
              missingInErp: true,
              missingInCrm: false,
              timeMismatch: false,
              canceled: crm.crmStatus === '2',
              conducted: crm.crmStatus === '3'
            }
          });
        }
      }

      // 4. Add remaining unmatched ERP lessons (junk / phantom lessons in ERP)
      for (const erp of erpItems) {
        if (usedErpIds.has(erp.scheduleId)) continue;
        const endMinutes = erp.startMinutes + 60;
        const pad = (n) => String(n).padStart(2, '0');
        const endTime = `${pad(Math.floor(endMinutes / 60) % 24)}:${pad(endMinutes % 60)}`;
        const shortDate = erp.date.split('-').reverse().slice(0, 2).join('.');

        merged.push({
          id: `erp-${erp.scheduleId}`,
          crm: null,
          erp,
          type: erp.studentsCount > 1 ? 'group' : 'individual',
          headerName: erp.groupTitle || 'Группа не указана',
          courseBadge: extractCourseBadge(erp),
          lessonNum: erp.current != null ? String(erp.current).padStart(2, '0') : '—',
          lessonTitle: cleanErpLessonTitle(erp),
          startTime: erp.startTime,
          endTime,
          startMinutes: erp.isStaleDate ? -1 : erp.startMinutes,
          endMinutes,
          students: [],
          flags: {
            missingInErp: false,
            missingInCrm: true,
            staleDate: erp.isStaleDate ? shortDate : null,
            timeMismatch: false,
            canceled: false,
            conducted: erp.lifecycleState === 'completed'
          }
        });
      }

      // 5. Sort chronologically (stale junk from previous days on top, then by time)
      merged.sort((a, b) => a.startMinutes - b.startMinutes);

      // 6. Visual state assignment
      const now = new Date();
      const nowMinutes = now.getHours() * 60 + now.getMinutes();

      let activeAssigned = false;
      if (isViewingToday) {
        for (const item of merged) {
          if (item.flags.conducted || item.flags.canceled || item.flags.missingInCrm) continue;
          const inProgress = nowMinutes >= item.startMinutes && nowMinutes <= item.endMinutes;
          const readyInErp = item.erp && item.erp.lifecycleState === 'attention';
          if (inProgress || readyInErp) {
            item.visualState = 'active';
            activeAssigned = true;
            break;
          }
        }
        if (!activeAssigned) {
          for (const item of merged) {
            if (item.flags.conducted || item.flags.canceled || item.flags.missingInCrm) continue;
            if (item.endMinutes >= nowMinutes) {
              item.visualState = 'active';
              activeAssigned = true;
              break;
            }
          }
        }
      }

      for (const item of merged) {
        if (item.visualState === 'active') continue;
        if (item.flags.conducted || item.flags.canceled) {
          item.visualState = 'past';
        } else {
          item.visualState = 'upcoming';
        }
      }

      return merged;
    }

    let currentLessons = [];
    let activeModalLesson = null;

    // =========================================================================
    // 4. RENDERING LESSONS LIST & MODALS
    // =========================================================================
    function getActiveTimerInfo(lesson) {
      if (selectedDate !== getTodayISO()) {
        return { text: `${lesson.startTime} — ${lesson.endTime}`, progress: 0 };
      }
      const now = new Date();
      const nowMin = now.getHours() * 60 + now.getMinutes();

      if (nowMin >= lesson.startMinutes && nowMin <= lesson.endMinutes) {
        const rem = Math.max(0, lesson.endMinutes - nowMin);
        const dur = Math.max(1, lesson.endMinutes - lesson.startMinutes);
        const pct = Math.min(100, Math.max(4, Math.round(((nowMin - lesson.startMinutes) / dur) * 100)));
        return { text: `Осталось ${rem} мин.`, progress: pct };
      }
      if (nowMin < lesson.startMinutes) {
        const wait = lesson.startMinutes - nowMin;
        const text = wait >= 60
          ? `Через ${Math.floor(wait / 60)} ч ${wait % 60} мин.`
          : `Через ${wait} мин.`;
        return { text, progress: 8 };
      }
      const over = nowMin - lesson.endMinutes;
      return { text: `Идёт (+${over} мин.)`, progress: 100 };
    }

    function renderFlagsHtml(flags, isLightCard) {
      const tags = [];
      const softTag = isLightCard
        ? 'bg-[#E8DCFA] text-[#1B012E]'
        : 'bg-white/10 text-white/90';

      if (flags.timeMismatch) {
        tags.push(`<span class="px-2.5 py-0.5 rounded-md text-[11.5px] font-medium bg-[#E2FA00] text-[#1A002E]">Время ERP: ${flags.erpTime}</span>`);
      }
      if (flags.missingInCrm) {
        const label = flags.staleDate ? `Нет в CRM · ${flags.staleDate}` : 'Нет в CRM';
        tags.push(`<span class="px-2.5 py-0.5 rounded-md text-[11.5px] font-medium ${softTag}">${label}</span>`);
      }
      return tags.join('');
    }

    function escapeHtml(str) {
      return (str || '').replace(/[&<>"']/g, (ch) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[ch]));
    }

      m.classList.add('flex');
    }

    function closeUserscriptModal() {
      const m = document.getElementById('userscript-modal');
      m.classList.add('hidden');
      m.classList.remove('flex');
    }

    function adjustStudentCoins(sIdx, delta) {
      if (!activeModalLesson || !activeModalLesson.students[sIdx]) return;
      const st = activeModalLesson.students[sIdx];
      st.coins = Math.max(0, st.coins + delta);
      const el = document.getElementById(`coins-st-${sIdx}`);
      if (el) el.innerText = st.coins;
    }

    function toggleStudentPresent(sIdx, checked) {
      if (!activeModalLesson || !activeModalLesson.students[sIdx]) return;
      activeModalLesson.students[sIdx].present = checked;
    }

    let absentSent = true;
    function toggleAbsentStatus() {
      absentSent = !absentSent;
      const btn = document.getElementById('absent-btn');
      const text = document.getElementById('absent-btn-text');
      if (absentSent) {
        btn.className = "bg-[#8D64AA] hover:bg-[#7B5298] text-white text-[14px] font-normal px-5 py-2 rounded-full transition-colors";
        text.innerText = "Списки отсутствующих поданы";
      } else {
        btn.className = "bg-[#E2FA00] hover:opacity-90 text-[#1A002E] text-[14px] font-medium px-5 py-2 rounded-full transition-colors";
        text.innerText = "Подать списки отсутствующих";
      }
    }

    function conductLesson() {
      closeLessonModal();
    }

    function saveSettings() {
      localStorage.setItem('kvant_course_rules', document.getElementById('setting-course-rules').value);
      localStorage.setItem('kvant_b24_webhook', document.getElementById('setting-b24-webhook').value.trim());
      localStorage.setItem('kvant_ktalk_url', document.getElementById('setting-ktalk-url').value.trim());
      localStorage.setItem('kvant_auto_absent', String(document.getElementById('setting-auto-absent').checked));
      closeSettingsModal();
      if (lastRawPayload) {
        processPayload(lastRawPayload);
      }
    }

    // =========================================================================
    // 5. FOOLPROOF TAMPERMONKEY BRIDGE, VERSION CHECK & HEALTH CHECKS
    // =========================================================================
    const REQUIRED_SCRIPT_VERSION = '1.2.2';
    let bridgeConnected = false;
    let installedScriptVersion = null;
    let pendingRequestId = 0;
    let loadTimeoutTimer = null;
    let lastRawPayload = null;

    function compareSemver(a, b) {
      const pa = String(a || '0.0.0').split('.').map((n) => parseInt(n, 10) || 0);
      const pb = String(b || '0.0.0').split('.').map((n) => parseInt(n, 10) || 0);
      for (let i = 0; i < 3; i++) {
        if ((pa[i] || 0) < (pb[i] || 0)) return -1;
        if ((pa[i] || 0) > (pb[i] || 0)) return 1;
      }
      return 0;
    }

    function isScriptOutdated(ver) {
      return compareSemver(ver || '0.0.0', REQUIRED_SCRIPT_VERSION) < 0;
    }

    function updatePlugVisual(state) {
      const plug = document.getElementById('plug-btn');
      if (state === 'attention') {
        plug.className = 'p-2 rounded-lg text-[#E2FA00] hover:bg-white/5 transition-colors';
      } else {
        plug.className = 'p-2 rounded-lg text-white/45 hover:text-white hover:bg-white/5 transition-colors';
      }
    }

    function renderNotices(items) {
      const stack = document.getElementById('status-stack');
      if (!items || items.length === 0) {
        stack.innerHTML = '';
        stack.classList.add('hidden');
        return;
      }

      stack.innerHTML = items.map((item) => `
        <div class="bg-[#280644] rounded-[16px] px-6 py-3.5 flex flex-wrap items-center justify-between gap-3">
          <div class="flex items-center gap-3 text-[14.5px] text-white/90">
            <span class="w-2 h-2 rounded-full ${item.urgent ? 'bg-[#E2FA00]' : 'bg-[#8B6CA6]'} flex-shrink-0"></span>
            <span>${item.text}</span>
          </div>
          <div class="flex items-center gap-3 flex-shrink-0">
            ${item.actions}
          </div>
        </div>
      `).join('');
      stack.classList.remove('hidden');
      lucide.createIcons();
    }

    function hideNotices() {
      renderNotices([]);
    }

    function openDatePicker() {
      const picker = document.getElementById('date-picker');
      if (typeof picker.showPicker === 'function') {
        picker.showPicker();
      } else {
        picker.click();
      }
    }

    function onDateChange(val) {
      if (!val) return;
      selectedDate = val;
      const badge = document.getElementById('date-badge');
      badge.innerText = val === getTodayISO() ? 'сегодня' : val.split('-').reverse().slice(0, 2).join('.');
      if (bridgeConnected) {
        requestTodayData();
      }
    }

    function stopSpinner() {
      document.getElementById('refresh-btn').classList.remove('animate-spin');
      if (loadTimeoutTimer) {
        clearTimeout(loadTimeoutTimer);
        loadTimeoutTimer = null;
      }
    }

    function requestTodayData() {
      if (!bridgeConnected) return;
      pendingRequestId++;
      const reqId = pendingRequestId;
      document.getElementById('refresh-btn').classList.add('animate-spin');

      if (loadTimeoutTimer) clearTimeout(loadTimeoutTimer);
      loadTimeoutTimer = setTimeout(() => {
        if (pendingRequestId === reqId) {
          stopSpinner();
          updatePlugVisual('attention');
          renderNotices([{
            urgent: true,
            text: `Нет ответа от скрипта Tampermonkey (требуется версия ${REQUIRED_SCRIPT_VERSION})`,
            actions: `<a href="kvanttouch.user.js" class="bg-[#E2FA00] text-[#1A002E] text-[13.5px] font-medium px-4 py-1.5 rounded-full">Обновить</a>`
          }]);
        }
      }, 15000);

      window.postMessage({
        source: 'KVANT_UI',
        type: 'FETCH_TODAY',
        date: selectedDate,
        requestId: reqId
      }, '*');
    }

    function processPayload(p) {
      lastRawPayload = p;
      const ver = p.scriptVersion || installedScriptVersion;
      const outdated = isScriptOutdated(ver);

      const crmOk = Boolean(p.crm?.ok);
      const crmAuth = Boolean(p.crm?.authRequired);
      const erpStudyOk = Boolean(p.erpStudy?.ok);
      const erpArchiveOk = Boolean(p.erpArchive?.ok);
      const erpAuth = Boolean(p.erpStudy?.authRequired || p.erpArchive?.authRequired);
      const erpOk = erpStudyOk && erpArchiveOk;

      const notices = [];

      if (outdated) {
        updatePlugVisual('attention');
        notices.push({
          urgent: true,
          text: `Скрипт устарел (${ver || '?'} → ${REQUIRED_SCRIPT_VERSION})`,
          actions: `<a href="kvanttouch.user.js" class="bg-[#E2FA00] text-[#1A002E] text-[13.5px] font-medium px-4 py-1.5 rounded-full hover:opacity-90 transition-opacity">Обновить</a>`
        });
      } else {
        updatePlugVisual('ok');
      }

      if (!crmOk) {
        notices.push({
          urgent: crmAuth,
          text: crmAuth ? 'Не выполнен вход в AlfaCRM' : `AlfaCRM недоступна (${escapeHtml(p.crm?.error || 'ошибка')})`,
          actions: (crmAuth ? `<a href="https://codeclassonline.s20.online/teacher/1/calendar/index" target="_blank" class="text-[13.5px] text-white/65 hover:text-white transition-colors">Открыть CRM ↗</a>` : '') +
            `<button onclick="requestTodayData()" class="bg-[#9300FF] hover:bg-[#7E00DB] text-white text-[13.5px] px-4 py-1.5 rounded-full transition-colors">Повторить</button>`
        });
      }

      if (!erpOk) {
        notices.push({
          urgent: erpAuth,
          text: erpAuth ? 'Не выполнен вход в ERP' : `ERP недоступна (${escapeHtml(p.erpStudy?.error || p.erpArchive?.error || 'ошибка')})`,
          actions: (erpAuth ? `<a href="https://erp.kvantastica.ru/admin/teacher-study" target="_blank" class="text-[13.5px] text-white/65 hover:text-white transition-colors">Открыть ERP ↗</a>` : '') +
            `<button onclick="requestTodayData()" class="bg-[#9300FF] hover:bg-[#7E00DB] text-white text-[13.5px] px-4 py-1.5 rounded-full transition-colors">Повторить</button>`
        });
      }

      renderNotices(notices);

      const crmList = crmOk ? (p.crm.data.collection || []) : [];
      const erpStudyList = erpStudyOk ? (p.erpStudy.data.data || []) : [];
      const erpArchiveList = erpArchiveOk ? (p.erpArchive.data.data || []) : [];

      if (crmOk || erpStudyOk || erpArchiveOk) {
        const merged = mergeCrmAndErp(crmList, erpStudyList, erpArchiveList, p.date || selectedDate);
        renderLessons(merged);
      } else {
        renderLessons([]);
      }
    }

    window.addEventListener('message', (event) => {
      if (event.origin !== window.location.origin && event.origin !== 'null') return;
      if (!event.data || event.data.source !== 'KVANT_BRIDGE') return;
      const msg = event.data;

      if (msg.type === 'BRIDGE_READY') {
        installedScriptVersion = msg.version || '0.0.0';
        const outdated = isScriptOutdated(installedScriptVersion);

        if (outdated) {
          updatePlugVisual('attention');
          document.getElementById('userscript-status-text').innerText =
            `Установлена устаревшая версия скрипта (${installedScriptVersion}). Требуется обновление до ${REQUIRED_SCRIPT_VERSION}.`;
        } else {
          updatePlugVisual('ok');
          document.getElementById('userscript-status-text').innerText =
            `Tampermonkey-мост подключён (версия ${installedScriptVersion}).`;
        }

        if (!bridgeConnected) {
          bridgeConnected = true;
          requestTodayData();
        }
      } else if (msg.type === 'TODAY_DATA') {
        stopSpinner();
        try {
          processPayload(msg.payload || {});
        } catch (err) {
          console.error('[квантtouch] Ошибка обработки данных:', err);
          renderNotices([{
            urgent: false,
            text: `Ошибка обработки расписания: ${escapeHtml(String(err))}`,
            actions: ''
          }]);
        }
      }
    });

    lucide.createIcons();

    let pingCount = 0;
    const pingTimer = setInterval(() => {
      if (bridgeConnected || pingCount >= 6) {
        clearInterval(pingTimer);
        if (!bridgeConnected) {
          updatePlugVisual('attention');
          renderNotices([{
            urgent: true,
            text: `Установи скрипт Tampermonkey (v${REQUIRED_SCRIPT_VERSION}) для загрузки уроков`,
            actions: `<a href="kvanttouch.user.js" class="bg-[#E2FA00] text-[#1A002E] text-[13.5px] font-medium px-4 py-1.5 rounded-full">Установить</a>`
          }]);
        }
        return;
      }
      pingCount++;
      window.postMessage({ source: 'KVANT_UI', type: 'PING' }, '*');
    }, 250);
  </script>
</body>
</html>
